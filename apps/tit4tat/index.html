<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tit for Tat</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 2rem auto;
        max-width: 760px;
        line-height: 1.6;
        padding: 0 1rem;
      }
      h1, h2 {
        margin-bottom: 0.4rem;
      }
      .screenshots {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
        margin: 1.5rem 0;
      }
      .screenshots figure {
        margin: 0;
      }
      .screenshots figcaption {
        margin-top: 0.5rem;
        font-size: 0.875rem;
        color: #666;
      }
      img.screenshot {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #ddd;
        border-radius: 6px;
      }
      footer {
        margin-top: 3rem;
        font-size: 0.875rem;
        color: #666;
      }
      footer a {
        color: #666;
      }
    </style>
  </head>
  <body>
    <h1>Tit for Tat</h1>
    <p>Track who handles which duties — fairly, privately, and in sync.</p>

    <p>Log morning, day and evening slots. See each year's history at a glance. Both partners stay in sync automatically via iCloud.</p>

    <p><a href="https://apps.apple.com/gb/app/tit-for-tat/id6829557138">Download on the App Store</a></p>

    <div class="screenshots">
      <figure>
        <img class="screenshot" src="screenshots/today-light.png" width="1179" height="2556" loading="lazy"
          alt="The Today screen: morning, day and evening slots, with a balance bar showing one partner 8 ahead" />
        <figcaption>Tap a slot to record who covered it.</figcaption>
      </figure>
      <figure>
        <img class="screenshot" src="screenshots/history-light.png" width="1179" height="2556" loading="lazy"
          alt="The History screen: each partner's credits, with a calendar grid for each year, from August to December" />
        <figcaption>See each partner's credits and months of history.</figcaption>
      </figure>
      <figure>
        <img class="screenshot" src="screenshots/partners-light.png" width="1179" height="2556" loading="lazy"
          alt="The Partners screen: the two partners, and a fair week grid splitting slots evenly at 8 each" />
        <figcaption>Agree what a fair week looks like.</figcaption>
      </figure>
    </div>

    <footer>
      <a href="privacy">Privacy Policy</a> &middot;
      <a href="support">Support</a>
    </footer>
  </body>
</html>
